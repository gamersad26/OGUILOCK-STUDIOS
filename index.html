<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGUILOCK-STUDIOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            color: #00ffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-x: hidden;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.85);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            padding: 40px;
            border: 2px solid #ff007f;
            box-shadow: 0 0 25px #ff007f, inset 0 0 25px rgba(0, 255, 255, 0.2);
            background: rgba(10, 10, 25, 0.6);
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        h1 {
            font-size: 3rem;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #ff007f;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            color: #05050f;
            background: #00ffff;
            border: none;
            border-radius: 5px;
            box-shadow: 0 0 15px #00ffff;
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn:hover {
            background: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 25px #ff007f, 0 0 40px #ff007f;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <h1>OGUILOCK-STUDIOS</h1>
        <p>IA, Agentes, Automatización y Herramientas de Vanguardia.</p>
        <div class="btn-group">
            <a href="https://github.com/gamersad26" target="_blank" class="btn">GitHub</a>
            <a href="https://twitch.tv/mqiupunk" target="_blank" class="btn">Twitch</a>
        </div>
    </div>
</body>
</html>
